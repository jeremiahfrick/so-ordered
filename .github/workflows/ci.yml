name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Type-check, test and bundle on every push and PR.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --no-cache
      - run: npm run build

  # Upload to Reddit on non-main branch pushes so the installed test version updates.
  # Needs the repo secret DEVVIT_AUTH_TOKEN. Publishing to the app directory stays manual (`devvit publish`).
  upload:
    name: Upload (test subreddit)
    needs: test
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Upload to Reddit
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_AUTH_TOKEN }}
        run: npx devvit upload
